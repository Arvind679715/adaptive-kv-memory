[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-kv-memory"
version = "1.0.0"
description = "Retrieval-preserving hierarchical KV cache compression for long-context LLM inference"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Arvind S.", email = "arvinds@ups.com"}
]
keywords = [
    "kv-cache", "llm", "compression", "quantization", "long-context",
    "pytorch", "transformers", "inference", "turboquant", "attention",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "rich",
    "ruff>=0.5",
]
bench = [
    "accelerate",
    "datasets",
    "rich",
    "matplotlib",
]
triton = [
    "triton>=2.1.0",
]
vllm = [
    "vllm>=0.4.0",
]
all = [
    "adaptive-kv-memory[dev,bench,triton,vllm]",
]

[project.urls]
Homepage = "https://github.com/arvind-s/adaptive-kv-memory"
Repository = "https://github.com/arvind-s/adaptive-kv-memory"
Issues = "https://github.com/arvind-s/adaptive-kv-memory/issues"
Documentation = "https://github.com/arvind-s/adaptive-kv-memory/tree/main/docs"

[project.scripts]
akv = "akv.cli:main"

[tool.setuptools.packages.find]
include = ["akv*"]

[tool.setuptools.package-data]
akv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
